AWSTemplateFormatVersion: "2010-09-09"
Description: Serverless weather data pipeline (S3, Lambda, EventBridge, Glue, Athena)

Parameters:
  Prefix:
    Type: String
    Default: dharani
    AllowedPattern: "^[a-z0-9-]{3,20}$"
  ScheduleExpression:
    Type: String
    Default: cron(0 6 * * ? *)

Resources:
  BronzeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Prefix}-weather-bronze-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SilverBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Prefix}-weather-silver-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Prefix}-weather-artifacts-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: write-bronze-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${BronzeBucket.Arn}/*"

  IngestFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Prefix}-weather-ingest"
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          BRONZE_BUCKET: !Ref BronzeBucket
      Code:
        ZipFile: |
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone
          import boto3

          s3 = boto3.client("s3")
          BUCKET = os.environ["BRONZE_BUCKET"]
          CITIES = {
              "new_york": (40.7128, -74.0060), "london": (51.5074, -0.1278),
              "tokyo": (35.6762, 139.6503), "sydney": (-33.8688, 151.2093),
              "dubai": (25.2048, 55.2708), "paris": (48.8566, 2.3522),
              "singapore": (1.3521, 103.8198), "mumbai": (19.0760, 72.8777),
              "sao_paulo": (-23.5505, -46.6333), "toronto": (43.6532, -79.3832),
          }
          DAILY = ("temperature_2m_max,temperature_2m_min,precipitation_sum,"
                   "uv_index_max,wind_speed_10m_max")

          def lambda_handler(event, context):
              today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
              for city, (lat, lon) in CITIES.items():
                  qs = urllib.parse.urlencode({
                      "latitude": lat, "longitude": lon, "daily": DAILY,
                      "timezone": "auto", "forecast_days": 1,
                  })
                  url = "https://api.open-meteo.com/v1/forecast?" + qs
                  with urllib.request.urlopen(url, timeout=10) as r:
                      body = json.loads(r.read())
                  body["city"] = city
                  body["ingestion_date"] = today
                  s3.put_object(
                      Bucket=BUCKET,
                      Key="ingestion_date=" + today + "/" + city + ".json",
                      Body=json.dumps(body),
                  )
              return {"status": "ok", "cities": len(CITIES), "date": today}

  DailyRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${Prefix}-weather-daily"
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Id: IngestLambda
          Arn: !GetAtt IngestFunction.Arn

  AllowEventBridgeInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyRule.Arn

  WeatherDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: weather_db

  GlueRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: glue.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: weather-s3-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub "${BronzeBucket.Arn}/*"
                  - !Sub "${SilverBucket.Arn}/*"
                  - !Sub "${ArtifactsBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource:
                  - !GetAtt BronzeBucket.Arn
                  - !GetAtt SilverBucket.Arn
                  - !GetAtt ArtifactsBucket.Arn

  BronzeCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub "${Prefix}-weather-bronze-crawler"
      Role: !GetAtt GlueRole.Arn
      DatabaseName: !Ref WeatherDatabase
      TablePrefix: bronze_
      Targets:
        S3Targets:
          - Path: !Sub "s3://${BronzeBucket}/"
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG

  SilverCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub "${Prefix}-weather-silver-crawler"
      Role: !GetAtt GlueRole.Arn
      DatabaseName: !Ref WeatherDatabase
      TablePrefix: silver_
      Targets:
        S3Targets:
          - Path: !Sub "s3://${SilverBucket}/"
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG

  BronzeToSilverJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub "${Prefix}-weather-bronze-to-silver"
      Role: !GetAtt GlueRole.Arn
      GlueVersion: "4.0"
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 15
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub "s3://${ArtifactsBucket}/scripts/bronze_to_silver.py"
      DefaultArguments:
        "--BRONZE_PATH": !Sub "s3://${BronzeBucket}/"
        "--SILVER_PATH": !Sub "s3://${SilverBucket}/"
        "--job-language": python
        "--enable-metrics": "true"

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "${Prefix}-weather"
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        ResultConfiguration:
          OutputLocation: !Sub "s3://${ArtifactsBucket}/athena-results/"

Outputs:
  BronzeBucketName:
    Value: !Ref BronzeBucket
  SilverBucketName:
    Value: !Ref SilverBucket
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
  LambdaName:
    Value: !Ref IngestFunction
  GlueJobName:
    Value: !Ref BronzeToSilverJob
  AthenaWorkGroupName:
    Value: !Ref AthenaWorkGroup
